name: vidyasetu_mobile
description: "VidyaSetu - Educational Android mobile app for BSE Odisha Class 10 students"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  audioplayers: ^6.0.0
  llama_cpp_dart: 0.9.0-dev.12
  sqlite3: 3.9.1
  path_provider: ^2.1.6
  path: ^1.9.1
  http: ^1.2.0
  uuid: ^4.5.1
  connectivity_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/db/offline_curriculum.db
    - assets/data/
